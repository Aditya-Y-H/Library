    <div id="books-card-container">

    <dialog id="add-book-modal" closedby="any">
      <form action="">
        <div class="input-container">
          <label for="title-input">Title</label>
          <input type="text" id="title-input" required />
        </div>

        <div class="input-container">
          <label for="synopsis-input">Synopsis</label>
          <input type="text" id="synopsis-input" />
        </div>

        <div class="input-container">
          <label for="author-input">Author</label>
          <input type="text" id="author-input" />
        </div>

        <div class="input-container">
          <label for="pages-input">Pages</label>
          <input type="number" id="pages-input" />
        </div>

        <label for="read-input">Pages</label>
        <input type="checkbox" id="read-input" />

        <button id="submit-book-btn" type="submit">Submit Book</button>
      </form>
    </dialog>
