<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="book.js" defer></script>
    <link rel="stylesheet" href="style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="library">
      <table id="library-table">
          <div id="library-table-container">
            <div id="caption">
              <p>Library</p>
    
              <label for="new-book-btn">

                <button id="new-book-btn" title="Add book"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M440-280h80v-160h160v-80H520v-160h-80v160H280v80h160v160ZM200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm0-80h560v-560H200v560Zm0-560v560-560Z"/></svg></button>
              </label>
            </div>
          <thead>
            <tr>
              <th>Title</th>
              <th>Author</th>
              <th>Number of Pages</th>
              <th>Status</th>
              <th>UUID</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <dialog class="modal" closedby="any">
      <form action="">
        <div class="header">
          <p>Add a Book</p>
          <button class="modal-close">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              height="24px"
              viewBox="0 -960 960 960"
              width="24px"
              fill="#e3e3e3"
            >
              <path
                d="m336-280-56-56 144-144-144-143 56-56 144 144 143-144 56 56-144 143 144 144-56 56-143-144-144 144Z"
              />
            </svg>
          </button>
        </div>

        <div class="input-container">
          <label for="book-title">Title</label>
          <input id="book-title" type="text" required />
        </div>

        <div class="input-container">
          <label for="book-author">Author</label>
          <input type="text" id="book-author" required />
        </div>

        <div class="input-container">
          <label for="book-pages">No. of pages</label>
          <input type="number" id="book-pages" required min="1" />
        </div>

        <button id="add-book-btn" type="submit">Add Book</button>
      </form>
    </dialog>
  </body>
</html>
